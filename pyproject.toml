[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "resumekit"
version = "0.3.0"
description = "Tailor, build and check ATS-friendly .docx resumes from a YAML profile."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["python-docx>=1.0", "PyYAML>=6.0", "pdfplumber>=0.10"]
keywords = ["resume", "cv", "docx", "ats", "job-search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
resumekit = "resumekit.cli:main"

[tool.setuptools]
packages = ["resumekit"]
